[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qbran"
version = "0.1.0"
description = "Quantum BRanch ANalysis: High-performance simulation of drive-induced state transitions in superconducting circuits"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Alessandro Miotto"}
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "h5py>=3.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0"
]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qbran*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]